<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Xen Shorif Info - Pro Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--bd:#e3e8f0;--tx:#0f172a;--mu:#64748b;--pr:#6366f1;--gr:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#d946ef);
--gold:#fef3c7;--gold-t:#d97706;--blue:#e0f2fe;--blue-t:#0284c7;--green:#dcfce7;--green-t:#16a34a;--red:#fee2e2;--red-t:#dc2626;--sp:cubic-bezier(.16,1,.3,1)}
[data-theme=dark]{--bg:#080b14;--card:#10172a;--bd:#1e2840;--tx:#f1f5f9;--mu:#94a3b8;--gold:#451a03;--gold-t:#fbbf24;--blue:#082f49;--blue-t:#38bdf8;--green:#052e16;--green-t:#4ade80;--red:#450a0a;--red-t:#f87171}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);min-height:100dvh;padding:14px 14px 90px;transition:background .3s}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(500px 300px at 85% -5%,rgba(139,92,246,.22),transparent),radial-gradient(400px 260px at -10% 20%,rgba(99,102,241,.16),transparent);pointer-events:none;z-index:-1}
.wrap{max-width:480px;margin:0 auto}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.bi{width:40px;height:40px;border-radius:13px;background:var(--gr);display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:0 8px 20px rgba(99,102,241,.4)}
.brand small{display:block;font-size:10px;color:var(--mu);font-weight:700;letter-spacing:.6px}
.ib{width:40px;height:40px;border-radius:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;cursor:pointer}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -14px 6px;padding-inline:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:30px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-size:12.5px;font-weight:700;cursor:pointer;transition:.25s var(--sp)}
.tab.on{background:var(--gr);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(99,102,241,.4)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.03)}
.search{text-align:center}
.badge{width:52px;height:52px;border-radius:50%;background:var(--blue);display:grid;place-items:center;margin:0 auto 10px;font-size:24px}
.title{font-size:20px;font-weight:800}.sub{font-size:12.5px;color:var(--mu);margin:4px 0 14px}
input{width:100%;padding:15px;border-radius:16px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-weight:700;text-align:center;outline:none;margin-bottom:12px}
input:focus{border-color:var(--pr)}
.go{width:100%;padding:15px;border:0;border-radius:16px;background:var(--gr);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(99,102,241,.38);transition:.2s}
.go:active{transform:scale(.97)}.go:disabled{opacity:.6}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:14px}
.seg b{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:12.5px;cursor:pointer;color:var(--mu)}
.seg b.on{background:var(--gr);color:#fff}
.ph{text-align:center;padding-bottom:14px;border-bottom:1px dashed var(--bd)}
.pn{font-size:21px;font-weight:800;word-break:break-word}
.uid{display:inline-block;margin-top:6px;padding:5px 12px;border-radius:9px;background:var(--bg);font-size:12px;color:var(--mu);font-weight:700;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:5px 11px;border-radius:9px;margin:5px 2px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gi{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:11px}
.gl{font-size:10.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.3px}
.gv{font-size:15px;font-weight:800;margin-top:3px;word-break:break-word}
.st{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;margin:18px 4px 8px;letter-spacing:.5px}
.img{width:100%;border-radius:16px;border:1px solid var(--bd);display:block;margin-top:8px;background:var(--bg);min-height:60px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:5px 9px;font-size:11.5px;font-weight:700}
.act{display:flex;gap:8px;margin-top:12px}
.act button{flex:1;padding:11px;border-radius:13px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:700;font-size:12.5px;cursor:pointer}
.sk{display:none}.sh{background:linear-gradient(90deg,var(--bd) 25%,rgba(148,163,184,.2) 50%,var(--bd) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}
.res{animation:up .35s var(--sp)}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.err{text-align:center;color:var(--red-t);background:var(--red);font-weight:700;font-size:13px}
.foot{text-align:center;font-size:12px;color:var(--mu);line-height:1.9;font-weight:600;margin-top:22px}
.foot a{color:var(--pr);text-decoration:none;font-weight:800}
.toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,20px);background:rgba(15,23,42,.95);color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-theme="light">
<div id="toast" class="toast"></div>
<div class="wrap">
  <div class="nav">
    <div class="brand"><div class="bi">⚡</div><div>Xen Shorif Info<small>FREE FIRE • BD SERVER</small></div></div>
    <button class="ib" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="tabs" id="tabs"></div>

  <div class="card search">
    <div class="badge" id="mIcon">⚡</div>
    <div class="title" id="mTitle">Player Info</div>
    <div class="sub" id="mSub"></div>
    <input id="q" inputmode="numeric" autocomplete="off" placeholder="Enter UID (e.g. 11978363054)" onkeydown="if(event.key==='Enter')run()">
    <button class="go" id="goBtn" onclick="run()">🔍 Search</button>
  </div>

  <div class="sk card" id="sk"><div class="sh" style="height:60px;margin-bottom:12px"></div><div class="g2"><div class="sh" style="height:56px"></div><div class="sh" style="height:56px"></div><div class="sh" style="height:56px"></div><div class="sh" style="height:56px"></div></div></div>
  <div id="out"></div>

  <div class="foot">
    <div>🤖 <b>Bot:</b> <a href="https://t.me/Shorif_ff_check_bot" target="_blank">@Shorif_ff_check_bot</a></div>
    <div>Fan-made tool • Built by <a href="https://t.me/xen_shorif" target="_blank">@xen_shorif</a></div>
  </div>
</div>

<script>
const API = "https://xen-shorif-info-src.vercel.app";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.colorScheme === 'dark') document.body.dataset.theme = 'dark'; }
const MODES = {
  player:{i:"👤",t:"Player Info",s:"Full profile, rank, guild, pet & loadout",ph:"Enter UID (e.g. 11978363054)"},
  ban:{i:"🛡️",t:"Ban Check",s:"Check account suspension status",ph:"Enter UID"},
  br:{i:"🏆",t:"BR Stats",s:"Solo • Duo • Squad (Ranked / Career)",ph:"Enter UID"},
  cs:{i:"⚔️",t:"CS Stats",s:"Clash Squad KDA, MVP & multi-kills",ph:"Enter UID"},
  guild:{i:"🏰",t:"Guild Info",s:"Guild details & leader statistics",ph:"Enter Player UID"},
  level:{i:"📊",t:"Level Progress",s:"EXP, likes & badges",ph:"Enter UID"},
  banner:{i:"🖼️",t:"Banner",s:"Ultra HD banner image",ph:"Enter UID"},
  outfit:{i:"🥋",t:"Outfit",s:"Equipped character render",ph:"Enter UID"},
  item:{i:"📦",t:"Item Asset",s:"HD transparent PNG by Item ID",ph:"Enter Item ID (e.g. 801055004)"}
};
let mode = 'player', season = 'RANKED', lastUid = '';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = x => (x === undefined || x === null || x === '' || isNaN(x)) ? '0' : Number(x).toLocaleString('en-US');
const v = x => (x === undefined || x === null || x === '') ? 'N/A' : esc(x);
const tag = (t, bg, c) => `<span class="tag" style="background:var(--${bg});color:var(--${c})">${t}</span>`;
const kv = (l, val, st = '') => `<div class="gi"><div class="gl">${l}</div><div class="gv" style="${st}">${val}</div></div>`;
const card = (inner, extra = '') => `<div class="card" ${extra}>${inner}</div>`;
const sec = t => `<div class="st">${t}</div>`;
const chips = a => (a && a.length) ? `<div class="chips">${a.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : `<div class="sub">None</div>`;
const pretty = (x, p) => esc(String(x || 'N/A').replace(p || '', '').replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase()));
const bd = ts => ts ? new Date(ts * 1000).toLocaleString('en-GB', {timeZone:'Asia/Dhaka', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true}) : 'N/A';
const ago = ts => { if (!ts) return ''; const d = Date.now()/1000 - ts; if (d < 3600) return Math.max(1, d/60|0) + 'm ago'; if (d < 86400) return (d/3600|0) + 'h ago'; const days = d/86400|0; return days < 365 ? days + 'd ago' : (days/365|0) + 'y ' + (days%365) + 'd ago'; };
const imgTag = (path, uid, alt) => `<img class="img" loading="lazy" referrerpolicy="no-referrer" alt="${alt}" src="${API}${path}?uid=${encodeURIComponent(uid)}" onerror="this.outerHTML='<div class=&quot;sub&quot;>⚠️ ${alt} লোড হয়নি</div>'">`;

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
function haptic(k = 'light') { try { tg.HapticFeedback.impactOccurred(k); } catch (e) {} }
function toggleTheme() { const d = document.body.dataset.theme === 'dark'; document.body.dataset.theme = d ? 'light' : 'dark'; $('themeBtn').textContent = d ? '🌙' : '☀️'; }
function copy(t) { navigator.clipboard && navigator.clipboard.writeText(t); toast('📋 Copied: ' + t); haptic(); }

function renderTabs() {
  $('tabs').innerHTML = Object.entries(MODES).map(([k, m]) => `<div class="tab ${k === mode ? 'on' : ''}" onclick="setMode('${k}')">${m.i} ${m.t}</div>`).join('');
}
function setMode(k) {
  mode = k; haptic(); const m = MODES[k];
  $('mIcon').textContent = m.i; $('mTitle').textContent = m.t; $('mSub').textContent = m.s; $('q').placeholder = m.ph;
  $('out').innerHTML = ''; renderTabs();
}

async function get(path, params) {
  const url = API + path + '?' + new URLSearchParams(params);
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(url, {signal: ctl.signal});
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.error) throw new Error(d.error || 'Server error (' + r.status + ')');
    return d;
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'Timeout! আবার চেষ্টা করুন' : e.message); }
  finally { clearTimeout(to); }
}

/* ---------- renderers ---------- */
function rPlayer(d) {
  const b = d.basicInfo; if (!b) throw new Error('Player not found!');
  const c = d.clanBasicInfo || {}, cap = d.captainBasicInfo || {}, p = d.profileInfo || {}, pet = d.petInfo || {}, soc = d.socialInfo || {}, cr = d.creditScoreInfo || {};
  const uid = b.accountId; lastUid = uid;
  return card(`<div class="ph"><div class="pn">${v(b.nickname)}</div><div class="uid" onclick="copy('${esc(uid)}')">UID: ${v(uid)} 📋</div>
    <div>${tag('👑 Prime Lv ' + ((b.primeInfo || {}).primeLevel || 0), 'gold', 'gold-t')}${tag('⭐ Lv. ' + (b.level || 0), 'blue', 'blue-t')}${tag('🌍 ' + v(b.region), 'green', 'green-t')}</div></div>
    <div class="g2">${kv('❤️ Likes', n(b.liked))}${kv('⚡ EXP', n(b.exp))}${kv('🎖️ Badges', b.badgeCnt || 0)}${kv('💯 Credit', v(cr.creditScore))}</div>
    <div class="act"><button onclick="jump('br')">🏆 BR Stats</button><button onclick="jump('cs')">⚔️ CS Stats</button><button onclick="jump('ban')">🛡️ Ban</button></div>`)
  + sec('🖼️ Banner') + imgTag('/banner', uid, 'Banner')
  + sec('📅 Account') + card(`<div class="g2" style="margin-top:0">${kv('Created', bd(b.createAt), 'font-size:12.5px')}${kv('Last Login', bd(b.lastLoginAt) + `<div class="gl" style="margin-top:3px">${ago(b.lastLoginAt)}</div>`, 'font-size:12.5px')}${kv('Account Age', ago(b.createAt))}${kv('Version / Season', v(b.releaseVersion) + ' / ' + v(b.seasonId))}</div>`)
  + sec('🏆 Ranking') + card(`<div class="g2" style="margin-top:0">${kv('BR Rank', v(b.rank), 'color:var(--pr)')}${kv('BR Points', n(b.rankingPoints), 'color:var(--pr)')}${kv('BR Max Rank', v(b.maxRank))}${kv('CS Rank', v(b.csRank), 'color:#0ea5e9')}${kv('CS Max Rank', v(b.csMaxRank))}${kv('Rank Shown', pretty(soc.rankShow, 'RankShow_'))}</div>`)
  + sec('🏰 Guild') + card(c.clanName ? `<div class="g2" style="margin-top:0">${kv('Name', v(c.clanName))}${kv('Level', 'Lv ' + (c.clanLevel || 0))}${kv('Members', (c.memberNum || 0) + ' / ' + (c.capacity || 40))}${kv('Guild ID', v(c.clanId), 'font-size:12.5px')}${kv('Leader', v(cap.nickname))}${kv('Leader Lv', 'Lv ' + (cap.level || 0))}</div>` : `<div class="sub" style="margin:0">❌ Not in any guild</div>`)
  + sec('🐾 Pet') + card(`<div class="g2" style="margin-top:0">${kv('Pet ID', v(pet.id))}${kv('Level', 'Lv ' + (pet.level || 0))}${kv('EXP', n(pet.exp))}${kv('Selected', pet.isSelected ? '✅ Yes' : '❌ No')}</div>`)
  + sec('👕 Loadout') + card(`<div class="gl">Weapon Skins</div>${chips(b.weaponSkinShows)}<div class="gl" style="margin-top:12px">Clothes</div>${chips(p.clothes)}<div class="gl" style="margin-top:12px">Equipped Skills</div>${chips(p.equipedSkills)}
    <div class="g2">${kv('Awakened', p.isSelectedAwaken ? '✅ Yes' : '❌ No')}${kv('Marked Star', p.isMarkedStar ? '⭐ Yes' : 'No')}${kv('Title ID', v(b.title), 'font-size:12.5px')}${kv('Gender', pretty(soc.gender, 'Gender_'))}</div>`)
  + sec('💎 Economy') + card(`<div class="g2" style="margin-top:0">${kv('Diamond Used', n((d.diamondCostRes || {}).diamondCost))}${kv('Reward', pretty(cr.rewardState, 'REWARD_STATE_'))}</div><div class="sub" style="margin:12px 0 0">💬 ${v(soc.signature)}</div>`)
  + sec('🥋 Outfit') + imgTag('/outfit', uid, 'Outfit');
}
function jump(m) { setMode(m); $('q').value = lastUid; run(); window.scrollTo({top: 0, behavior: 'smooth'}); }

function rBan(d) {
  const bad = d.is_banned;
  return card(`<div style="text-align:center"><div class="badge" style="font-size:28px">🛡️</div><div class="pn">${v(d.Nickname)}</div><div class="uid">UID: ${v(d.UID)}</div>
    <div style="margin-top:12px">${bad ? tag('🚨 BANNED (' + v(d.period) + ')', 'red', 'red-t') : tag('✅ CLEAN / NOT BANNED', 'green', 'green-t')}</div></div>
    <div class="g2">${kv('Region', v(d.Region))}${kv('Level', v(d.level))}</div>`);
}
function seg() { return `<div class="seg">${['RANKED', 'CAREER'].map(s => `<b class="${s === season ? 'on' : ''}" onclick="season='${s}';haptic();run()">${s}</b>`).join('')}</div>`; }
function rBR(d) {
  const m = (t, s) => { s = s || {}; return sec(t) + card(`<div class="g2" style="margin-top:0">${kv('Matches', n(s.games_played))}${kv('Wins', n(s.wins) + ' <small>(' + v(s.win_rate) + ')</small>')}${kv('Kills', n(s.kills))}${kv('K/D', v(s.kd_ratio), 'color:var(--pr)')}${kv('Deaths', n(s.deaths))}${kv('Best Kills', n(s.highest_kills))}${kv('Headshot', n(s.headshot_kills) + ' <small>(' + v(s.headshot_rate) + ')</small>')}${kv('Damage', n(s.damage))}</div>`); };
  return seg() + card(`<div class="ph" style="border:0;padding:0"><div class="pn">🏆 ${v(d.nickname)}</div><div class="uid">${season} • UID ${v(d.uid)}</div></div>`) + m('👥 Squad', d.squad) + m('🤝 Duo', d.duo) + m('👤 Solo', d.solo);
}
function rCS(d) {
  return seg() + card(`<div class="ph"><div class="pn">⚔️ ${v(d.nickname)}</div><div class="uid">${season} • UID ${v(d.uid)}</div></div>
    <div class="g2">${kv('Matches', n(d.matches))}${kv('Wins', n(d.wins) + ' <small>(' + v(d.win_rate) + ')</small>')}${kv('Kills', n(d.kills))}${kv('Deaths', n(d.deaths))}${kv('Assists', n(d.assists))}${kv('K/D', v(d.kd_ratio))}${kv('Official KDA', v(d.official_kda), 'color:var(--pr)')}${kv('Headshot', n(d.headshot_kills) + ' <small>(' + v(d.headshot_rate) + ')</small>')}${kv('MVP', n(d.mvp))}${kv('Damage', n(d.damage))}${kv('Double Kills', n(d.double_kills))}${kv('Triple Kills', n(d.triple_kills))}${kv('Quadra Kills', n(d.quadra_kills), 'color:var(--gold-t)')}</div>`);
}
function rGuild(d) {
  const c = d.clanBasicInfo || {}, cap = d.captainBasicInfo || {};
  if (!c.clanName) return card(`<div class="sub" style="margin:0;text-align:center">❌ This player is not in any guild.</div>`);
  return card(`<div class="ph"><div class="pn">🏰 ${v(c.clanName)}</div><div class="uid" onclick="copy('${esc(c.clanId)}')">ID: ${v(c.clanId)} 📋</div></div>
    <div class="g2">${kv('Level', 'Lv ' + (c.clanLevel || 0))}${kv('Members', (c.memberNum || 0) + ' / ' + (c.capacity || 40))}${kv('Leader', v(cap.nickname))}${kv('Leader UID', v(cap.accountId), 'font-size:12.5px')}${kv('Leader Level', 'Lv ' + (cap.level || 0))}${kv('Leader Likes', n(cap.liked))}</div>`);
}
function rLevel(d) {
  const b = d.basicInfo; if (!b) throw new Error('Player not found!');
  return card(`<div class="ph"><div class="pn">${v(b.nickname)}</div><div class="uid">UID: ${v(b.accountId)}</div></div>
    <div class="g2">${kv('Level', 'Lv ' + (b.level || 0))}${kv('EXP', n(b.exp))}${kv('Likes', n(b.liked))}${kv('Badges', b.badgeCnt || 0)}${kv('Prime', 'Lv ' + ((b.primeInfo || {}).primeLevel || 0))}${kv('Season', v(b.seasonId))}</div>`);
}
function rItem(id) {
  const cdn = [`https://cdn.jsdelivr.net/gh/ShahGCreator/icon@main/PNG/${id}.png`, `https://cdn.jsdelivr.net/gh/0xMe/ff-resources@main/pngs/300x300/${id}.png`, `https://0xme.github.io/ff-resources/pngs/300x300/${id}.png`];
  window.__cdn = cdn; window.__i = 0;
  return card(`<div style="text-align:center"><div class="pn">📦 Item ${esc(id)}</div><div class="uid">Transparent HD PNG</div>
    <div style="margin:16px auto;max-width:230px;min-height:190px;display:grid;place-items:center;background:var(--bg);border-radius:18px;border:1px solid var(--bd)">
    <img id="itemImg" referrerpolicy="no-referrer" src="${cdn[0]}" style="max-width:90%;max-height:170px;object-fit:contain" onerror="nextCdn(this)"></div>
    <a id="dl" class="go" style="display:block;text-decoration:none" href="${cdn[0]}" target="_blank" download="${esc(id)}.png">⬇️ Download PNG</a></div>`);
}
function nextCdn(img) { window.__i++; if (window.__i < window.__cdn.length) { img.src = window.__cdn[window.__i]; $('dl').href = img.src; } else { img.outerHTML = '<div class="sub">⚠️ Asset Not Found!</div>'; } }

/* ---------- main ---------- */
async function run() {
  const val = $('q').value.trim();
  if (!val) return toast('⚠️ Please enter UID first!');
  if (mode !== 'item' && !/^\d{5,14}$/.test(val)) return toast('⚠️ সঠিক numeric UID দিন');
  if (mode === 'item' && !/^\d+$/.test(val)) return toast('⚠️ সঠিক Item ID দিন');
  const btn = $('goBtn'); btn.disabled = true; btn.textContent = '⏳ Fetching...';
  $('out').innerHTML = ''; $('sk').style.display = 'block'; haptic('medium');
  try {
    let html = '';
    if (mode === 'player') html = rPlayer(await get('/player-info', {uid: val}));
    else if (mode === 'ban') html = rBan(await get('/bancheck', {uid: val}));
    else if (mode === 'br') html = rBR(await get('/stats/br', {uid: val, mode: season}));
    else if (mode === 'cs') html = rCS(await get('/stats/cs', {uid: val, mode: season}));
    else if (mode === 'guild') html = rGuild(await get('/player-info', {uid: val}));
    else if (mode === 'level') html = rLevel(await get('/player-info', {uid: val}));
    else if (mode === 'banner') html = card(imgTag('/banner', val, 'Banner'));
    else if (mode === 'outfit') html = card(imgTag('/outfit', val, 'Outfit'));
    else html = rItem(val);
    if (mode !== 'item') lastUid = val;
    $('out').innerHTML = `<div class="res">${html}</div>`;
    toast('✅ Loaded Successfully!');
  } catch (e) {
    $('out').innerHTML = `<div class="card err">❌ ${esc(e.message)}</div>`;
    haptic('heavy');
  } finally { $('sk').style.display = 'none'; btn.disabled = false; btn.textContent = '🔍 Search'; }
}
renderTabs(); setMode('player');
</script>
</body>
</html>
